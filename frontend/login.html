<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Login | SmartGrievance
    </title>

    <link rel="stylesheet"
          href="css/style.css">
    <script src="js/language.js" defer></script>

</head>

<body class="auth-page">


<div class="auth-container">


    <div class="auth-brand">

        <a href="index.html"
           class="brand">

            <div class="brand-icon">
                SG
            </div>

            <div>

                <strong>SmartGrievance</strong>

                <small>
                    AI Complaint System
                </small>

            </div>

        </a>

    </div>


    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                🔐
            </div>

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to manage your complaints
            </p>

        </div>


        <form id="loginForm">


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="student@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <div class="label-row">

                    <label>
                        Password
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="remember-row">

                <label>

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>

            </div>


            <button
                type="submit"
                class="auth-button">

                Login to Dashboard

            </button>


        </form>


        <div class="auth-divider">

            <span>
                OR
            </span>

        </div>


        <button
            class="google-button"
            type="button">

            <span>
                G
            </span>

            Continue with Google

        </button>


        <p class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

    </div>


    <p class="security-note">

        🔒 Your information is securely protected.

    </p>

</div>


<div id="toast"
     class="toast">

</div>


<script src="js/auth.js"></script>

</body>

</html>
